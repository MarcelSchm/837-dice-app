name: Android CI

# On every push to main and every PR: validate the Gradle wrapper, run the
# tests, lint, build the APKs, generate an SBOM and scan it for known CVEs.
# On a version tag (v1.0, v1.1, ...): additionally create a GitHub release
# with the APKs and the SBOM attached.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved, and the
# release job handles the signing keystore. Dependabot keeps the pins current.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default - the two jobs that need to write say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are pointless, but never abort a release half-way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Tests, APK & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to file the CVE findings under Security -> Code scanning.
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # A tampered gradle-wrapper.jar would run arbitrary code in this
      # workflow - checked against the official checksums before any build.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (the dice rules!)
        run: ./gradlew test

      # Android-specific checks (exported components, manifest issues, ...).
      # Blocking on branches and PRs, where a finding can be fixed in peace -
      # but never on a release tag: a lint warning must not stop the group
      # from getting their build the evening before the festival.
      - name: Android Lint
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:lintRelease :wear:lintRelease

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: "*/build/reports/lint-results-*.html"
          retention-days: 14
          if-no-files-found: ignore

      - name: Restore release keystore from secret (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "No signing secrets found - the APK will be debug-signed."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Only matches on real "vX.Y[.Z]" tag builds - app/build.gradle.kts
          # derives versionCode/versionName from this. On branch/PR builds
          # ref_name isn't a matching tag, so it falls back to a dev version.
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew assembleRelease

      # The bill of materials: every library that ends up in the app, with
      # versions and purls. Shipped with the release so it is always possible
      # to answer "was this app affected by CVE-X?" after the fact.
      - name: Generate SBOM (CycloneDX)
        run: ./gradlew :app:cyclonedxDirectBom

      - name: Collect release files
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk \
             "837-dice-${VERSION}-${GITHUB_SHA::7}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk \
             "837-dice-wear-${VERSION}-${GITHUB_SHA::7}.apk"
          cp app/build/reports/cyclonedx-direct/bom.json \
             "837-dice-${VERSION}-sbom.cdx.json"

      - name: Upload APKs and SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 837-dice-apk
          path: |
            837-dice-*.apk
            837-dice-*-sbom.cdx.json
          retention-days: 90

      # The SBOM on its own, for every build and not just for tagged
      # releases - so "what was in the app back then?" stays answerable for
      # any commit, not only the ones that became a version.
      - name: Upload the SBOM separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: app/build/reports/cyclonedx-direct/bom.json
          retention-days: 90

      # Known vulnerabilities in what we actually ship. Reported, not
      # blocking: the app has no internet permission at all, so a CVE in a
      # library is rarely reachable here - but we still want to know.
      - name: Scan the SBOM for known CVEs (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: app/build/reports/cyclonedx-direct/bom.json
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Same scan again, but as SARIF for GitHub's Security tab. Two runs
      # instead of converting, because the table is what a human wants in
      # the summary and SARIF is what the Security tab wants.
      - name: Scan the SBOM again for the Security tab (SARIF)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: app/build/reports/cyclonedx-direct/bom.json
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Findings land under Security -> Code scanning, with history over
      # time instead of being buried in one job log.
      - name: Upload the findings to the Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sbom

      - name: Put the CVE report into the job summary
        if: always()
        run: |
          {
            echo "## Known CVEs (HIGH/CRITICAL)"
            echo ""
            if [ -s trivy-report.txt ]; then
              echo '```'
              cat trivy-report.txt
              echo '```'
            else
              echo "Nothing found. 🎉"
            fi
            echo ""
            echo "SBOM: the \`sbom\` artifact of this run, or"
            echo "\`*-sbom.cdx.json\` on the release for tagged builds."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Only this job may write - the build job above cannot.
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags, needed by git-cliff for release notes
          fetch-depth: 0

      - name: Download the built APKs and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 837-dice-apk

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          # Only the changes of the tag being released
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Add install instructions to release notes
        run: |
          cat >> RELEASE_NOTES.md <<'EOF'

          ---
          **Install:** download the APK below, open it on your phone and
          allow installation from unknown sources.

          **Pixel Watch:** the `-wear-` APK is the standalone watch app -
          sideload it onto the watch via `adb install` (developer mode +
          wireless debugging on the watch).

          **SBOM:** `*-sbom.cdx.json` lists every library in this build
          (CycloneDX).
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            837-dice-*.apk
            837-dice-*-sbom.cdx.json
          body_path: RELEASE_NOTES.md

  # After a release tag, regenerate CHANGELOG.md and push it back to main
  # as a bot commit - no manual git-cliff run needed.
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            # chore(release) commits are skipped by cliff.toml on purpose
            git commit -m "chore(release): update CHANGELOG.md for ${GITHUB_REF_NAME}"
            git push origin main
          else
            echo "CHANGELOG.md already up to date."
          fi

  # Reports the full transitive dependency tree to GitHub's dependency graph.
  # Without this, Dependabot only sees the version catalog and cannot warn
  # about vulnerabilities in indirect dependencies.
  dependency-graph:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Only what is actually shipped. Unfiltered, this reports the whole
      # build - including Gradle's plugin classpath, which is why 54
      # Dependabot alerts turned up against settings.gradle.kts for Netty,
      # Jackson and Bouncy Castle. None of those are in
      # `:app:dependencies --configuration releaseRuntimeClasspath`; they
      # belong to AGP, lint and apksigner and never reach a phone.
      #
      # Build tooling still gets updated - Dependabot proposes AGP and
      # Gradle bumps from the version catalog either way. This only stops
      # the alert list from being drowned in findings about libraries that
      # are not in the app.
      - name: Submit dependencies
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-configurations: "^releaseRuntimeClasspath$"
